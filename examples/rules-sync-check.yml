# Example only: copy to .github/workflows/ in the repo that holds rules-sync.json.
name: rules-sync check
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      # Exits 1 when any target has drifted, so the run shows red.
      - run: node dist/cli.js check --config rules-sync.json
